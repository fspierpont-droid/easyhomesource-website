name: Temporary catalog strict validation

on:
  push:
    branches:
      - 'fix/catalog-seed-duplicate-fields'
    paths:
      - '.github/workflows/temporary-catalog-strict-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/catalog-seed-duplicate-fields
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Strict TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
