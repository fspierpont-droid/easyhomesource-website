name: EHS AI agent production diagnostic

on:
  push:
    branches:
      - qa/ehs-agent-production-smoke

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://easyhomesource-website.vercel.app
    steps:
      - name: Probe sanitized agent runtime diagnostic
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Content-Type: application/json" \
            -H "x-ehs-agent-diagnostic: ehs-agent-auth-check-20260829" \
            -d '{"message":"I want the Timber Creek Lakewood","conversationHistory":[]}' \
            "$PRODUCTION_URL/api/chat" -o /tmp/diagnostic.json
          cat /tmp/diagnostic.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/diagnostic.json','utf8'));
          console.log('Diagnostic:', JSON.stringify(data.diagnostic || null, null, 2));
          NODE
