name: Property Geocode Audit

on:
  push:
    branches:
      - feature/amhi-operational-tracking
    paths:
      - 'scripts/geocode-property-backfill.py'
      - '.github/workflows/property-geocode-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run audited property geocoder
        run: python scripts/geocode-property-backfill.py

      - name: Upload coordinate report
        uses: actions/upload-artifact@v4
        with:
          name: property-geocode-report
          path: tmp/property-geocode-report.json
          if-no-files-found: error
