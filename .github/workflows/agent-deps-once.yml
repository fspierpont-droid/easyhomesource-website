name: Install EHS agent dependencies once

on:
  push:
    branches:
      - fix/ehs-ai-sales-agent

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current AI SDK and schema dependency
        run: npm install ai@latest zod@latest
      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/agent-deps-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/agent-deps-once.yml
          git commit -m "Install AI SDK for EHS sales agent"
          git push origin HEAD:fix/ehs-ai-sales-agent
