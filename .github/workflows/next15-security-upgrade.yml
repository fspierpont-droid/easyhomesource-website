name: Next security upgrade validation

on:
  push:
    branches:
      - security/next-15-5-21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current Active LTS security baseline
        run: |
          npm install --save-exact \
            next@16.3.3 \
            eslint-config-next@16.3.3 \
            react@19.2.8 \
            react-dom@19.2.8 \
            @types/react@19 \
            @types/react-dom@19 \
            postcss@latest
          npm audit fix
          npm pkg set scripts.dev="next dev --webpack"
          npm pkg set scripts.build="next build --webpack"

      - name: Validate public catalog
        run: npm run validate:catalog

      - name: Run GHL/auth/quote regression tests
        run: npm run test:ghl

      - name: Run Project Board coordinate tests
        run: npm run test:project-coordinates

      - name: Run Project Board cache tests
        run: npm run test:project-cache

      - name: Run production build with existing webpack aliases
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated dependency files after green validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
          else
            git commit -m "chore: upgrade Next.js security baseline"
            git push origin HEAD:security/next-15-5-21
          fi
