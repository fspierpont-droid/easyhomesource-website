name: Temporary login throttle formatting

on:
  push:
    branches:
      - 'fix/login-failure-throttling'
    paths:
      - '.github/workflows/temporary-login-throttle-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout auth branch
        uses: actions/checkout@v4
        with:
          ref: fix/login-failure-throttling

      - name: Normalize focused continuation indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/main.py')
          text = path.read_text()
          replacements = {
              '''        raise HTTPException(\n  status_code=429,\n  detail="Too many failed login attempts. Please wait and try again.",\n  headers={"Retry-After": str(retry_after)},\n        )''': '''        raise HTTPException(\n            status_code=429,\n            detail="Too many failed login attempts. Please wait and try again.",\n            headers={"Retry-After": str(retry_after)},\n        )''',
              '''        await collection.update_one(\n  {"key": key},\n  {"$set": {"key": key, "count": 1, "reset_at": now + window, "updated_at": now}},\n  upsert=True,\n        )''': '''        await collection.update_one(\n            {"key": key},\n            {"$set": {"key": key, "count": 1, "reset_at": now + window, "updated_at": now}},\n            upsert=True,\n        )''',
              '''    await get_db().rate_limits.delete_one({"key": _login_rate_limit_key(email)})\n\n@app.on_event''': '''    await get_db().rate_limits.delete_one({"key": _login_rate_limit_key(email)})\n\n\n@app.on_event''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected formatting target not found: {old[:60]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit formatting correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          git commit -m 'Normalize login throttle formatting'
          git push origin HEAD:fix/login-failure-throttling
