name: Frontend checks

on:
  pull_request:
    paths:
      - 'lib/auth/**'
      - 'lib/chat/**'
      - 'lib/catalog/**'
      - 'lib/seo/**'
      - 'app/api/portal/auth/**'
      - 'app/api/portal/admin/**'
      - 'app/api/portal/catalog/**'
      - 'app/api/portal/projects/**'
      - 'app/api/portal/ready-to-quote/**'
      - 'app/api/portal/home-inventory/**'
      - 'app/api/chat/**'
      - 'app/settings/**'
      - 'app/portal/system-health/**'
      - 'app/quotes/**'
      - 'app/layout.tsx'
      - 'app/robots.ts'
      - 'app/sitemap.ts'
      - 'components/ChatWidget.tsx'
      - 'components/portal/AdminSettingsPage.tsx'
      - 'components/portal/CatalogManagementPage.tsx'
      - 'components/portal/QuoteBuilderCatalogAuthority.tsx'
      - 'components/portal/SystemHealthPage.tsx'
      - 'components/portal/PortalSidebar.tsx'
      - 'components/portal/HomeInventoryView.tsx'
      - 'types/homeInventory.ts'
      - 'app/login/**'
      - 'app/homes/**'
      - 'components/HomeCard.tsx'
      - 'components/HomeImage.tsx'
      - 'components/HomeMediaGallery.tsx'
      - 'data/site.ts'
      - 'data/homes.ts'
      - 'data/catalogHomeSeeds.ts'
      - 'data/homeMedia.ts'
      - 'data/*Media*.ts'
      - 'data/timberCreekCatalog.ts'
      - 'scripts/validate-catalog.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/frontend-auth-checks.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public catalog
        run: npm run validate:catalog
      - name: Test catalog authority
        run: node --experimental-strip-types --test lib/catalog/catalogAuthority.test.ts
      - name: Run ESLint
        run: npm run lint
      - name: Run portal/GHL tests
        run: npm run test:ghl
      - name: Build production Next.js app
        run: npm run build
      - name: Smoke test public home detail routes
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ehs-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/homes > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Next.js server did not become ready."
            cat /tmp/ehs-next.log
            exit 1
          fi

          routes=(
            "/homes/tulip"
            "/homes/dogwood"
            "/homes/born-to-run"
            "/homes/paxton"
            "/homes/boujee-xl-2"
            "/homes/white-oak"
          )

          for route in "${routes[@]}"; do
            status=$(curl --location --silent --output /tmp/ehs-route.html --write-out "%{http_code}" "http://127.0.0.1:3000${route}")
            echo "${route} -> ${status}"
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200 for ${route}, got ${status}."
              cat /tmp/ehs-next.log
              exit 1
            fi
          done
