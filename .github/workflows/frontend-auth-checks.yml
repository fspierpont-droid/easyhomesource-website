name: Frontend auth checks

on:
  pull_request:
    paths:
      - 'lib/auth/**'
      - 'app/api/portal/auth/**'
      - 'app/api/portal/projects/**'
      - 'app/api/portal/ready-to-quote/**'
      - 'app/login/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-auth-checks.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run portal/GHL tests
        run: npm run test:ghl
      - name: Build production Next.js app
        run: npm run build
