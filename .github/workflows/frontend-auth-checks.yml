name: Frontend checks

on:
  pull_request:
    paths:
      - 'lib/auth/**'
      - 'app/api/portal/auth/**'
      - 'app/api/portal/projects/**'
      - 'app/api/portal/ready-to-quote/**'
      - 'app/api/portal/home-inventory/**'
      - 'components/portal/HomeInventoryView.tsx'
      - 'types/homeInventory.ts'
      - 'app/login/**'
      - 'app/homes/**'
      - 'components/HomeCard.tsx'
      - 'components/HomeImage.tsx'
      - 'components/HomeMediaGallery.tsx'
      - 'data/homes.ts'
      - 'data/catalogHomeSeeds.ts'
      - 'data/homeMedia.ts'
      - 'data/*Media*.ts'
      - 'data/timberCreekCatalog.ts'
      - 'scripts/validate-catalog.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-auth-checks.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public catalog
        run: npm run validate:catalog
      - name: Run portal/GHL tests
        run: npm run test:ghl
      - name: Build production Next.js app
        run: npm run build
