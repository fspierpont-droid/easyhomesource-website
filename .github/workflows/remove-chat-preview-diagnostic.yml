name: Remove chatbot preview diagnostic

on:
  push:
    branches:
      - fix/chatbot-preview-diagnostic-security

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove preview-only GET diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/chat/route.ts')
          text = path.read_text()
          marker = "\n// Preview-only diagnostic path used to verify that the deployed Vercel runtime can\n"
          if marker not in text:
              raise SystemExit('Preview diagnostic marker was not found')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n')
          PY
          rm .github/workflows/remove-chat-preview-diagnostic.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove chatbot preview inference diagnostic"
          git push origin HEAD:fix/chatbot-preview-diagnostic-security
